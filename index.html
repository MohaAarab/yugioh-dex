    <option value="Guerrier">Guerrier</option>
    <option value="Bête Ailée">Bête Ailée</option>
  </select>

        </article>
      </template> -->

      </section>

      <aside class="flex w-full min-w-0 flex-col gap-6 lg:w-[420px] lg:shrink-0">

        <!-- ===================== MON ÉQUIPE (INCOMPLÈTE) ===================== -->
        <section id="team" aria-label="Mon équipe" class="rounded-card bg-ground p-6 border-4 border-brand-light"style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">
          <div class="flex justify-between">
            <h2 class="font-display text-2xl font-extrabold text-cream">Mon équipe</h2>
          <div id="team-counter" class="border border-brand-light rounded-2xl px-2 py-2 text-brand">0/6</div>
          </div>
        <div id="team-slots" class="grid min-w-0 flex-1 grid-cols-2 gap-5 mt-3 text-center text-cream sm:grid-cols-3"></div>

        </section>

    <!-- ===================== FORMULAIRE DE CRÉATION ===================== -->
    <section id="create" aria-label="Nouvelle créature" class="flex flex-col gap-6 rounded-card bg-ground border-2 border-brand-light p-8"style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">
      <div>
        <h2 class="font-display text-3xl font-extrabold text-cream">Nouvelle créature</h2>
        <p class="text-muted">Chaque champ est vérifié avant l'ajout de la créature.</p>
      </div>
      <form id="creature-form" novalidate class="grid grid-cols-1 gap-5 text-cream  md:grid-cols-2 lg:grid-cols-4">
        <label class="flex flex-col gap-1 text-sm font-bold " >ID
          <input name="id" id="id" type="text" placeholder="#010" class="field font-normal border border-brand-light bg-ink invalid:" >
          <span id="idError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Nom
          <input name="name" id="name" type="text" placeholder="Nom de la créature" class="field font-normal border border-brand-light bg-ink">
          <span id="nameError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Type
          <select name="type" id="type" class="field font-normal border border-brand-light bg-ink">
            <option value="">Choisir un type</option>
                <option value="Tous">Tous les types</option>
                <option value="Bête">Bête</option>
                <option value="Bête-Guerrier">Bête-Guerrier</option>
                <option value="Dieu Créateur">Dieu Créateur</option>
                <option value="Cyberse">Cyberse</option>
                <option value="Dinosaure">Dinosaure</option>
                <option value="Bête Divine">Bête Divine</option>
                <option value="Dragon">Dragon</option>
                <option value="Démon">Démon</option>
                <option value="Poisson">Poisson</option>
                <option value="Insecte">Insecte</option>
                <option value="Machine">Machine</option>
                <option value="Rocheux">Rocheux</option>
                <option value="Serpent de mer">Serpent de mer</option>
                <option value="Magicien">Magicien</option>
                <option value="Tonnerre">Tonnerre</option>
                <option value="Guerrier">Guerrier</option>
                <option value="Bête Ailée">Bête Ailée</option>
          </select>
          <span class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label  class="flex flex-col gap-1 text-sm font-bold">Niveau
          <input name="level" id="level" type="text" placeholder="Base, Niveau 1…" class="field font-normal border border-brand-light bg-ink">
          <span id="levelError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <!-- <label class="flex flex-col gap-1 text-sm font-bold">HP
          <input name="stat1" id="hp" type="text" placeholder="0 à 999" class="field font-normal border border-brand-light bg-ink">
          <span class="error-message text-sm font-normal text-muted"></span>
        </label> -->
        <label class="flex flex-col gap-1 text-sm font-bold">Attaque
          <input name="stat2" id="attack" type="text" placeholder="0 à 5000" class="field font-normal border border-brand-light bg-ink">
          <span id="attackError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Defence
          <input name="stat3" id="defence" type="text" placeholder="0 à 5000" class="field font-normal border border-brand-light bg-ink">
          <span id="defenceError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label class="flex flex-col gap-1 text-sm font-bold">Lien de l'image
          <input name="image" id="img" type="text" placeholder="https://…/image.png" class="field font-normal border border-brand-light bg-ink">
          <span id="imgError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <label  class="flex flex-col gap-1 text-sm font-bold md:col-span-2 lg:col-span-4">Description
          <textarea id="description" name="description" rows="3" placeholder="10 à 200 caractères" class="rounded-xl border border-brand-light bg-ink p-3 font-normal outline-none"></textarea>
          <span id="descriptionError" class="error-message text-sm font-normal text-muted"></span>
        </label>
        <div class="flex flex-wrap justify-end gap-3 md:col-span-2 lg:col-span-4">
          <button type="reset" class="btn-outline px-6 bg-ground text-cream border border-brand-light hover:text-ink hover:bg-brand">Effacer</button>
          <button type="submit" id="add_creature" class="btn-primary border border-brand-light hover:bg-line "style="box-shadow: 0 0 30px rgba(250, 204, 21, 0.6);">Ajouter la créature</button>
        </div>
      </form>
